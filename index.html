
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel & Bytes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Pixel & Bytes</h1>
<div class="wrap">
  <div class="card">
    <p class="label">Canvas</p>
    <canvas id="art" width="16" height="16"></canvas>
    <div class="swatches" id="swatches"></div>
    <div class="tools">
      <button id="brush" class="on">Brush</button>
      <button id="eraser">Eraser</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div class="card side">
    <p class="label">Pixel Inspector</p>
    <div class="mono" id="info" style="margin-bottom:18px">Hover over a pixel</div>
    <p class="label">Raw Bytes (RGBA)</p>
    <pre class="mono" id="dump"></pre>
    <p class="label">SHA-256</p>
    <div class="hash" id="hash"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
</body>

</html>
